  .dot.hollow { background: #fff; border: 2.5px solid #495057; }

  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chart-card { border: 1.5px solid #868e96; border-radius: 14px; padding: 18px 16px 8px; }
